name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.lock

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install gitleaks (pinned and checksum verified)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo "GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"

      - name: Verify (lint, tests, build, secrets)
        run: python scripts/verify.py

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: docker build --tag allinkay:ci .

      - name: Smoke test the image
        run: |
          docker run --detach --name allinkay --publish 10000:10000 allinkay:ci
          for i in $(seq 1 30); do
            if curl --silent --fail http://localhost:10000/health; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:10000/health
          curl --silent --fail http://localhost:10000/ | grep -q '<div id="root">'
          docker logs allinkay

services:
  - type: web
    name: allinkay
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ALLINKAY_SCENARIO
        value: demo
      - key: ALLINKAY_SPEED
        value: "3600"
      - key: ALLINKAY_GITHUB_REPO
        value: jarlh19/allinkay
      - key: ALLINKAY_GITHUB_TOKEN
        sync: false
